spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  h2:
    console:
      enabled: false

  flyway:
    locations: classpath:db/migration
    # Never let anything wipe the production schema (the demo reset is also disabled here).
    clean-disabled: true

pronto:
  demo:
    enabled: false
