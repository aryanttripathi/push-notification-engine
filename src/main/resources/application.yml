spring:
  application:
    name: pronto

  # Default profile: zero-setup H2 file DB in MySQL mode. Prod uses the `mysql` profile.
  datasource:
    url: jdbc:h2:file:./data/pronto;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;LOCK_TIMEOUT=10000
    username: sa
    password: ""

  # Local-dev only: the mysql profile turns it off, and it never accepts remote connections.
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  flyway:
    locations: classpath:db/migration,classpath:db/sample
    # The /demo "Reset data" button runs flyway.clean() + migrate() on this local H2 DB.
    clean-disabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Instant -> plain DATETIME(6) in UTC on both H2 and MySQL.
          preferred_instant_jdbc_type: TIMESTAMP

logging:
  file:
    name: logs/pronto.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 70MB
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    # preferred_instant_jdbc_type is flagged "incubating" on every boot; the setting is intended.
    org.hibernate.orm.incubating: ERROR

pronto:
  demo:
    # /demo and /api/v1/demo/*: creates demo users and rules, so never in production.
    enabled: true
